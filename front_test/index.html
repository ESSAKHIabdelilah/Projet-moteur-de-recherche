<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Moteur de Recherche</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; }
        input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        .result-card { border: 1px solid #eee; padding: 15px; margin-bottom: 10px; border-radius: 8px; transition: 0.3s; }
        .result-card:hover { background: #f9f9f9; border-color: #007bff; }
        .score { font-size: 0.8em; color: #666; font-weight: bold; }
        .similar-btn { font-size: 0.7em; background: #28a745; margin-left: 10px; }
    </style>
</head>
<body>

    <h1>🔍 Mon Moteur de Recherche</h1>
    
    <div class="search-box">
        <input type="text" id="query" placeholder="Tapez un mot (ex: science)...">
        <button onclick="search()">Rechercher</button>
    </div>

    <div id="results">
        </div>

    <script>
        const API_URL = "http://localhost:5000/api";

        async function search() {
            const q = document.getElementById('query').value;
            const resDiv = document.getElementById('results');
            resDiv.innerHTML = "Chargement...";

            try {
                const response = await fetch(`${API_URL}/search?q=${q}`);
                const data = await response.json();
                
                resDiv.innerHTML = `<h3>${data.length} résultats trouvés</h3>`;
                data.forEach(book => {
                    resDiv.innerHTML += `
                        <div class="result-card">
                            <strong>${book.titre}</strong> 
                            <span class="score">| TF-IDF: ${book.tfidf_final.toFixed(4)} | Clics: ${book.clics}</span>
                            <button class="similar-btn" onclick="getSimilar(${book.id})">Livres Similaires</button>
                        </div>`;
                });
            } catch (err) {
                resDiv.innerHTML = "<p style='color:red'>Erreur: Vérifie que ton Backend Flask est bien lancé sur le port 5000.</p>";
            }
        }

        async function getSimilar(id) {
            try {
                const response = await fetch(`${API_URL}/similar/${id}`);
                const data = await response.json();
                let list = data.map(b => `- ${b.titre} (Sim: ${b.indice_similarite.toFixed(3)})`).join('\n');
                alert(data.length > 0 ? "Livres recommandés :\n" + list : "Aucune recommandation trouvée pour ce livre.");
            } catch (err) {
                alert("Erreur lors de la récupération des recommandations.");
            }
        }
    </script>
</body>
</html>
